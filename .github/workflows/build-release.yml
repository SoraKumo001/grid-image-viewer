name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Opt into Node.js 24 to address deprecation warnings for Node.js 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/quick-image-viewer.csproj

    - name: Build app (Unpackaged)
      run: dotnet build src/quick-image-viewer.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:EnableMsixTooling=false -p:Platform=x64 -o publish

    - name: Create ZIP archive
      run: |
        $buildDir = "publish"
        # Remove debug symbols to reduce ZIP size
        Get-ChildItem $buildDir -Filter "*.pdb" -Recurse | Remove-Item -Force
        Compress-Archive -Path "$buildDir\*" -DestinationPath "quick-image-viewer-win-x64.zip"

    - name: Build Installer
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        if (-not $version) { $version = "1.4.0" }
        $buildDir = "publish"
        iscc /dMyAppVersion=$version /dBuildDir=$buildDir installer.iss

    - name: Extract Changelog Section
      id: extract_changelog
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $eventName = "${{ github.event_name }}"
        Write-Host "Extracting changelog for tag: $tag (Event: $eventName)"
        
        if (-not (Test-Path CHANGELOG.md)) {
            Write-Host "CHANGELOG.md not found."
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "found=false`n")
            return
        }

        $changelog = Get-Content CHANGELOG.md -Raw
        # Normalize line endings
        $changelog = $changelog -replace "`r`n", "`n"
        
        $content = ""
        
        # 1. Try exact tag match
        $tagEscaped = [regex]::Escape($tag)
        # Note: We use \s* after tag to handle potential trailing spaces or content like "(Current)"
        $pattern = "(?ms)^##\s+" + $tagEscaped + "\s*.*?\n(.*?)(?=\n##\s+v|$)"
        
        if ($changelog -match $pattern) {
            Write-Host "Match found for tag $tag"
            $content = $matches[1].Trim()
        } 
        
        # 2. Fallback for manual dispatch or branch pushes
        if (-not $content -and ($tag -eq "main" -or $tag -eq "master" -or $eventName -eq "workflow_dispatch")) {
            Write-Host "Tag match failed or not a tag push. Falling back to the first version section."
            $fallbackPattern = "(?ms)^##\s+v\d+\.\d+\.\d+.*?\n(.*?)(?=\n##\s+v|$)"
            if ($changelog -match $fallbackPattern) {
                Write-Host "Found first version section as fallback."
                $content = $matches[1].Trim()
            }
        }

        if ($content) {
            Write-Host "Content extracted (Length: $($content.Length)). Writing to RELEASE_BODY.md"
            # Ensure UTF8 without BOM (standard in pwsh)
            $content | Set-Content -Path RELEASE_BODY.md -Encoding utf8
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "found=true`n")
        } else {
            Write-Host "FAILED: No matching changelog section found for '$tag'."
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "found=false`n")
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: ${{ steps.extract_changelog.outputs.found == 'true' && 'RELEASE_BODY.md' || '' }}
        generate_release_notes: ${{ steps.extract_changelog.outputs.found != 'true' }}
        files: |
          quick-image-viewer-win-x64.zip
          quick-image-viewer-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
