name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/quick-image-viewer.csproj

    - name: Publish app (Unpackaged)
      run: dotnet publish src/quick-image-viewer.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:EnableMsixTooling=false -p:Platform=x64 -o ./publish

    - name: Create ZIP archive
      run: |
        # Remove debug symbols to reduce ZIP size
        Get-ChildItem ./publish -Filter "*.pdb" -Recurse | Remove-Item -Force
        Compress-Archive -Path "./publish/*" -DestinationPath "quick-image-viewer-win-x64.zip"

    - name: Build Installer
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        if (-not $version) { $version = "1.4.0" }
        iscc /dMyAppVersion=$version /dBuildDir=publish installer.iss

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          quick-image-viewer-win-x64.zip
          quick-image-viewer-setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
