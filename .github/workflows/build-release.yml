name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Opt into Node.js 24 to address deprecation warnings for Node.js 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/quick-image-viewer.csproj

    - name: Build app (Unpackaged)
      run: dotnet build src/quick-image-viewer.csproj -c Release -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:EnableMsixTooling=false -p:Platform=x64 -o publish

    - name: Create ZIP archive
      run: |
        $buildDir = "publish"
        # Remove debug symbols to reduce ZIP size
        Get-ChildItem $buildDir -Filter "*.pdb" -Recurse | Remove-Item -Force
        Compress-Archive -Path "$buildDir\*" -DestinationPath "quick-image-viewer-win-x64.zip"

    - name: Build Installer
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        if (-not $version) { $version = "1.4.0" }
        $buildDir = "publish"
        iscc /dMyAppVersion=$version /dBuildDir=$buildDir installer.iss

    - name: Extract Changelog Section
      id: extract_changelog
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        Write-Host "Extracting changelog for tag: $tag"
        
        if (-not (Test-Path CHANGELOG.md)) {
            Write-Host "CHANGELOG.md not found."
            "found=false" | Add-Content -Path $env:GITHUB_OUTPUT
            return
        }

        $changelog = Get-Content CHANGELOG.md -Raw
        # Normalize line endings
        $changelog = $changelog -replace "`r`n", "`n"
        
        # Escape tag for regex and match the section
        $tagEscaped = [regex]::Escape($tag)
        # Pattern matches: ## [tag] [anything] \n [content] [lookahead for next header or end]
        $pattern = "(?ms)^##\s+" + $tagEscaped + ".*?\n(.*?)(?=\n##\s+v|$)"
        
        if ($changelog -match $pattern) {
            $content = $matches[1].Trim()
            if ($content) {
                Write-Host "Found changelog section for $tag"
                $content | Out-File -FilePath RELEASE_BODY.md -Encoding utf8
                "found=true" | Add-Content -Path $env:GITHUB_OUTPUT
            } else {
                Write-Host "Changelog section for $tag is empty."
                "found=false" | Add-Content -Path $env:GITHUB_OUTPUT
            }
        } else {
            Write-Host "Changelog section for $tag not found in CHANGELOG.md"
            "found=false" | Add-Content -Path $env:GITHUB_OUTPUT
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: ${{ steps.extract_changelog.outputs.found == 'true' && 'RELEASE_BODY.md' || '' }}
        generate_release_notes: ${{ steps.extract_changelog.outputs.found != 'true' }}
        files: |
          quick-image-viewer-win-x64.zip
          quick-image-viewer-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
