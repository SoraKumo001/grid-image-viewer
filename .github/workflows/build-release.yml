name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore grid-image-viewer.csproj

    - name: Publish app
      run: dotnet publish grid-image-viewer.csproj -c Release -r win-x64 --self-contained true -p:PublishProfile=Properties\PublishProfiles\win-x64.pubxml -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -p:EnableMsixTooling=false -o publish_output

    - name: Create ZIP archive
      run: Compress-Archive -Path "publish_output\*" -DestinationPath "grid-image-viewer-win-x64.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: grid-image-viewer-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
